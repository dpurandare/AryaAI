<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2875c"/>
      <stop offset="100%" stop-color="#b8532f"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square baked directly into the art rather than relying on the
       OS to mask it — verified live that macOS didn't visibly round a
       full-bleed square the way the squircle-enforcement research implied. -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- A friendly face wearing a headset — borrows the "operator/secretary"
       idea (headset = assistant, from a reference the user pointed to)
       merged with the face concept already settled on, rather than the
       reference's literal multi-element illustration (person + headset +
       separate clipboard), which is too detailed to hold up at icon sizes.
       Eyes sized/spaced to clear the earpieces with a real gap — the first
       pass had them colliding into one blob. The face (eyes + smile) is
       shifted right of center, as if the head has turned slightly toward
       the mic side, and the boom is re-anchored to actually meet the new
       mouth position (previously it ended well short of the mouth, looking
       disconnected) rather than just avoiding a collision. -->
  <path
    d="M 266 420 Q 290 176 512 166 Q 734 176 758 420"
    fill="none"
    stroke="#ffffff"
    stroke-width="44"
    stroke-linecap="round"
  />
  <circle cx="266" cy="420" r="52" fill="#ffffff"/>
  <circle cx="758" cy="420" r="52" fill="#ffffff"/>
  <path
    d="M 266 420 C 240 500 270 565 395 598"
    fill="none"
    stroke="#ffffff"
    stroke-width="30"
    stroke-linecap="round"
  />
  <circle cx="395" cy="598" r="22" fill="#ffffff"/>

  <ellipse cx="452" cy="452" rx="40" ry="82" fill="#ffffff"/>
  <ellipse cx="668" cy="452" rx="40" ry="82" fill="#ffffff"/>
  <path
    d="M 428 648 Q 560 764 692 648"
    fill="none"
    stroke="#ffffff"
    stroke-width="54"
    stroke-linecap="round"
  />
</svg>
