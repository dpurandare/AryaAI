<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2875c"/>
      <stop offset="100%" stop-color="#b8532f"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square baked directly into the art rather than relying on the
       OS to mask it — verified live that macOS didn't visibly round a
       full-bleed square the way the squircle-enforcement research implied. -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- A simple, friendly face — two eyes and a smile — evoking "Sachiv"
       (secretary/companion) directly, the way Finder's icon is literally a
       face, rather than an abstract initial. -->
  <ellipse cx="382" cy="448" rx="52" ry="92" fill="#ffffff"/>
  <ellipse cx="642" cy="448" rx="52" ry="92" fill="#ffffff"/>
  <path
    d="M 366 640 Q 512 776 658 640"
    fill="none"
    stroke="#ffffff"
    stroke-width="58"
    stroke-linecap="round"
  />
</svg>
