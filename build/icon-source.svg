<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3d6fb0"/>
      <stop offset="100%" stop-color="#1b3f6e"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Tracing the reference silhouette's actual shape more faithfully this
       time — a bob-cut head (wider than a plain circle, flaring at ear
       level, with a notch cut in for the neck/collar) rather than the
       circle-head abstractions that kept reading as emoji-like. -->
  <path
    d="M 512 120
       C 650 120 742 218 742 350
       C 742 428 708 468 646 496
       C 610 512 572 488 548 462
       L 512 458
       L 476 462
       C 452 488 414 512 378 496
       C 316 468 282 428 282 350
       C 282 218 374 120 512 120 Z"
    fill="#ffffff"
  />

  <path
    d="M 150 1024 L 150 860 C 150 640 260 420 512 420 C 764 420 874 640 874 860 L 874 1024 Z"
    fill="#ffffff"
  />

  <!-- Laptop as a solid black accent, not a background-gradient cutout —
       the cutout looked like a flat mismatched patch instead of a clean
       see-through (the gradient reference resolves oddly reused across two
       very different-sized shapes even with userSpaceOnUse). A deliberate
       two-tone accent is simpler and more reliable, and gives the
       blue-and-black palette its "black" half. -->
  <rect x="366" y="800" width="292" height="156" rx="26" fill="#14181f"/>
  <rect x="464" y="900" width="96" height="26" rx="13" fill="#ffffff"/>
</svg>
