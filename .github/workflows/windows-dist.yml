name: Windows installer (manual)

# On-demand build of the real Windows installer (electron-builder's NSIS target), for testing
# on a clean Windows machine/VM without installing git/Node/Python there first (TASKS #202).
# Does not publish a GitHub Release or a version tag — unlike release.yml, this never runs
# automatically; it only produces a downloadable build artifact from the Actions run page.
on:
  workflow_dispatch:

jobs:
  dist-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: sachivji-windows-installer
          path: release/*.exe
          retention-days: 14
