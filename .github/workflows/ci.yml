name: CI

on:
  # Paused (2026-09-21, explicit request) — was firing on every push and
  # failing on real issues (a Windows-only test bug in keychain.test.ts's
  # file-permission check, plus an unrelated transient Electron-download
  # 504 from GitHub's own CDN). Re-enable by restoring the push/pull_request
  # triggers below once ready to resume the per-push cadence.
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test
