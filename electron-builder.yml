appId: com.sachiv.app # kept as-is despite the Sachiv -> Sachivji rename — an internal bundle identifier, not display branding; changing it would be treated as a different app by OS update/keychain scoping
productName: Sachivji
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - '!**/.vscode/*'
# Native binaries (.node addons, sqlite-vec's platform .dylib/.so/.dll) can't
# be dlopen()'d from inside the asar virtual filesystem. Confirmed live on
# this app's first-ever real packaged launch: without this, the app hangs
# behind a native "uncaught exception" alert. Necessary but not sufficient on
# its own — sqlite-vec's own path resolution doesn't know to look in
# app.asar.unpacked either, so src/main/db/index.ts also rewrites the
# resolved path itself before loading. See that file's comment for why.
asarUnpack:
  - '**/*.node'
  - 'node_modules/sqlite-vec-*/**'
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false # set to true once an Apple Developer notarization profile is configured (TASKS.md #63/#64)
  identity: null # no Apple Developer ID yet (TASKS.md #63) — explicit, not an implicit auto-discovery fallback
  target:
    - dmg
win:
  target:
    - nsis
  # Sponsor build (TASKS #202): a self-contained Python so the installer needs no system
  # Python at all. Fetched by `npm run fetch:bundled-python:win` (scripts/fetch-bundled-python-win.mjs)
  # into resources/ (gitignored) before packaging; `workspace-runtime.ts`'s `defaultRuntimeDeps()`
  # looks for it under `process.resourcesPath` at runtime.
  # CPU-only Ollama (no CUDA/Vulkan), fetched by `npm run fetch:bundled-ollama:win`
  # (scripts/fetch-bundled-ollama-win.mjs) — the embedding model itself isn't bundled, it's
  # pulled over the network on first run, so this is just the ~66MB runtime.
  extraResources:
    - from: resources/python-win-x64
      to: python-win-x64
    - from: resources/python-win-x64-wheels
      to: python-win-x64-wheels
    - from: resources/ollama-win-x64
      to: ollama-win-x64
    # A self-contained Node so `npx`-launched MCP servers (e.g. Context7, manual-test 13.4) work
    # with no system Node install — found live on the sponsor VM (`npx` not on PATH at all).
    # Fetched by `npm run fetch:bundled-node:win` (scripts/fetch-bundled-node-win.mjs).
    # Split in two: electron-builder's own copy filter (app-builder-lib's createFilter,
    # util/filter.js) unconditionally drops any directory named exactly "node_modules" sitting
    # at a copy entry's own `from` root (meant to stop an app's own node_modules double-bundling,
    # no opt-out) — found live on the sponsor VM when `npx` itself resolved but then crashed with
    # MODULE_NOT_FOUND on npm's own node_modules/npm/bin/npx-cli.js, which turned out to be
    # missing entirely from the installed build. A second entry rooted one level inside
    # node_modules sidesteps the exact-string check (its own relative paths are never literally
    # "node_modules").
    - from: resources/node-win-x64
      to: node-win-x64
    - from: resources/node-win-x64/node_modules
      to: node-win-x64/node_modules
    # The pulled nomic-embed-text's published context size (8192) exceeds its real trained
    # context (2048) and crashes llama-server on an embed call — see the file itself. Bundled
    # so `ollama-runtime.ts` can re-create the model in place with the fix, no network needed
    # for this part.
    - from: models/ModelFileNomicEmbed
      to: ModelFileNomicEmbed
# Sponsor build (TASKS #202): electron-builder's NSIS default is "oneClick" — a bare
# progress bar that closes with no Finish page, no visible confirmation, and no shortcut
# of its own. Fine for a developer who knows to search the Start Menu; confusing for a
# non-technical sponsor who needs to see the install actually finished and how to launch
# it. The standard wizard below shows a Finish page with an explicit "Run now" checkbox
# and creates both shortcuts.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
linux:
  target:
    - AppImage
    - deb
  category: Utility
deb:
  maintainer: "Deepak Purandare <dpurandare@users.noreply.github.com>"
  # Setting `depends` REPLACES electron-builder's defaults, so those are repeated here
  # (electron-builder 26.15.3's documented deb defaults) with Python added: Sachivji's
  # workspace runtime needs `python3` and the separately-packaged `python3-venv`
  # (docs/design-discussion.md 4.3). dmg / AppImage / NSIS cannot declare this — see README.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - python3
    - python3-venv
publish:
  provider: github
  owner: dpurandare
  repo: AryaAI
  releaseType: draft # human reviews and publishes manually — see TASKS.md #13
