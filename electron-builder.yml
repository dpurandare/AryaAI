appId: com.sachiv.app
productName: Sachiv
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - '!**/.vscode/*'
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false # set to true once an Apple Developer notarization profile is configured (TASKS.md #63/#64)
  identity: null # no Apple Developer ID yet (TASKS.md #63) — explicit, not an implicit auto-discovery fallback
  target:
    - dmg
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
  category: Utility
deb:
  maintainer: "Deepak Purandare <dpurandare@users.noreply.github.com>"
publish:
  provider: github
  owner: dpurandare
  repo: AryaAI
  releaseType: draft # human reviews and publishes manually — see TASKS.md #13
